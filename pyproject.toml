[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
# Required by pytest-homeassistant-custom-component: its autouse event-loop
# fixtures are async, so without this *every* test errors at setup -- including
# the pure ones. The two settings move together; see
# docs/tech/TECH-STACK.md#test-dependencies.
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF",
]
ignore = [
  "E501", # long lines in translations/url strings; formatter handles the rest
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.fermob"]
combine-as-imports = true
