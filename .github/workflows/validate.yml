name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch breakage from new Home Assistant / HACS releases, not just our own commits.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` requires the domain to be listed in home-assistant/brands,
          # which is a prerequisite for the HACS *default store* only. This is a
          # custom repository and is not seeking default-store inclusion, so the
          # check is not applicable; every other HACS check still runs.
          ignore: brands

  tests:
    name: protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # protocol.py imports nothing from Home Assistant, so the test run needs
      # only these two packages.
      - run: pip install pytest cryptography
      - run: pytest tests/ -q
