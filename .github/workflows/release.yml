name: Auto Release

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Extract version from manifest.json
        id: version
        run: |
          version=$(jq -r '.version' custom_components/fermob/manifest.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          # No post-processing: the section is already valid Markdown, and the
          # tidy-up this used to pipe through destroyed it. `sed '/^$/N'` pulls a
          # blank line and the line after it into one pattern space, and the
          # following `s/^[[:space:]]*//` then matched that leading newline --
          # `^` anchors to the pattern space, and [[:space:]] includes \n. So
          # every paragraph break disappeared, along with the two-space indent
          # on wrapped bullets. A closing paragraph would then be swallowed into
          # the last bullet by Markdown's lazy continuation.
          #
          # Command substitution strips trailing newlines, which is the only
          # trimming actually wanted here.
          notes=$(awk -v ver="${VERSION}" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          echo "${notes}" > /tmp/release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --notes-file /tmp/release-notes.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
